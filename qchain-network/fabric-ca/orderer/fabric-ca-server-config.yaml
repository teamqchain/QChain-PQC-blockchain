version: 1.2.0
port: 9054
debug: false

tls:
  enabled: true
  certfile:
  keyfile:

ca:
  name: OrdererCA
  keyfile:
  certfile:
  chainfile:

registry:
  maxenrollments: -1
  identities:
    - name: admin
      pass: adminpw
      type: client
      affiliation: ""
      attrs:
        hf.Registrar.Roles: "*"
        hf.Registrar.DelegateRoles: "*"
        hf.Revoker: true
        hf.IntermediateCA: true
        hf.GenCRL: true
        hf.Registrar.Attributes: "*"
        hf.AffiliationMgr: true

db:
  type: sqlite3
  datasource: fabric-ca-server.db

csr:
  cn: ca.orderer.example.com
  names:
    - C: AE
      ST: Sharjah
      L: Sharjah
      O: orderer.example.com
      OU:
  hosts:
    - localhost
    - ca.orderer.example.com
  ca:
    expiry: 131400h
    pathlength: 1

signing:
  default:
    usage:
      - digital signature
    expiry: 8760h
  profiles:
    ca:
      usage: [cert sign, crl sign]
      expiry: 43800h
      caconstraint:
        isca: true
        maxpathlen: 0
    tls:
      usage: [signing, key encipherment, server auth, client auth, key agreement]
      expiry: 8760h

bccsp:
  default: SW
  sw:
    hash: SHA2
    security: 256
    filekeystore:
      keystore: msp/keystore