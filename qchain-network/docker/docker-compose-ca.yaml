networks:
  fabric_net:

services:

  ca.government.uae.com:
    image: hyperledger/fabric-ca:latest
    hostname: ca.government.uae.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=GovernmentCA
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../fabric-ca/government:/etc/hyperledger/fabric-ca-server
    ports:
      - 7054:7054
      - 17054:17054
    networks:
      - fabric_net

  ca.general.uae.com:
    image: hyperledger/fabric-ca:latest
    hostname: ca.general.uae.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=GeneralCA
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:18054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../fabric-ca/general:/etc/hyperledger/fabric-ca-server
    ports:
      - 8054:8054
      - 18054:18054
    networks:
      - fabric_net

  ca.orderer.example.com:
    image: hyperledger/fabric-ca:latest
    hostname: ca.orderer.example.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=OrdererCA
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:19054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../fabric-ca/orderer:/etc/hyperledger/fabric-ca-server
    ports:
      - 9054:9054
      - 19054:19054
    networks:
      - fabric_net