# =============================================================================
# QCHAIN WEB GATEWAY — NGINX CONFIG
# =============================================================================
#
# This is the SINGLE public entry point for the whole QChain demo. Tailscale
# Funnel forwards the public HTTPS address (https://<vm>.<tailnet>.ts.net) to
# this server on port 8090, and this server decides — purely by URL path —
# which of three things to serve:
#
#     /          → the QPortal web app  (issuer / verifier / admin)
#     /wallet/   → the QWallet web app  (credential holder)
#     /api/      → the Go backend API   (forwarded to localhost:3000)
#
# Because everything lives under ONE address, the browser treats the apps and
# the API as the "same origin" — so there are no CORS or mixed-content issues,
# and there is only ONE service to keep alive.
#
# Why port 8090 (not 80 or 8080)? Port 8080 is already used by the IPFS
# gateway on the VM, and 80 may be taken — 8090 is free. Tailscale Funnel maps
# the public port 443 → this 8090, so visitors never see the port number.
# =============================================================================

server {
    # The container runs with --network host, so this binds the VM's port 8090.
    listen 8090;
    server_name _;

    # Both Flutter web builds are copied here by the Dockerfile:
    #   /usr/share/nginx/html/          → QPortal  (built with base-href "/")
    #   /usr/share/nginx/html/wallet/   → QWallet  (built with base-href "/wallet/")
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses before sending = faster page loads.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;

    # -------------------------------------------------------------------------
    # Gateway health check
    # -------------------------------------------------------------------------
    # A trivial endpoint so scripts / Tailscale can confirm the gateway itself
    # is alive without hitting the backend. ("= /gw-health" = exact match.)
    location = /gw-health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # -------------------------------------------------------------------------
    # /api/  →  Go backend on localhost:3000
    # -------------------------------------------------------------------------
    # "^~" means: once a request starts with /api/, use THIS block and do not
    # fall through to the regex caching rules below. The trailing slash on
    # proxy_pass strips the "/api" prefix, so:
    #     /api/health            → backend /health
    #     /api/mobile/getCatalog → backend /mobile/getCatalog
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # /wallet/  →  QWallet web app
    # -------------------------------------------------------------------------
    # Served straight from /usr/share/nginx/html/wallet/. "^~" guarantees the
    # wallet's own assets (e.g. /wallet/main.dart.js) are served from here and
    # are NOT stolen by the asset-caching regex (which would look in the portal
    # root). try_files falls back to the wallet's index.html so a refresh works.
    location = /wallet { return 301 /wallet/; }   # bare /wallet → /wallet/
    location ^~ /wallet/ {
        try_files $uri $uri/ /wallet/index.html;
    }

    # -------------------------------------------------------------------------
    # Static asset caching (PORTAL root assets only)
    # -------------------------------------------------------------------------
    # Thanks to the "^~" blocks above, this regex can only ever match portal
    # files at the root, never /api/* or /wallet/* paths.
    location ~* \.(woff|woff2|ttf|otf|eot|ico|svg|png|jpg|jpeg|gif|webp|wasm)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # /  →  QPortal web app (the catch-all)
    # -------------------------------------------------------------------------
    # Anything not matched above is the portal. try_files serves the real file
    # if it exists, otherwise index.html so Flutter's router handles the route
    # (this is what makes deep links like /dashboard work on refresh).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening (same as the standalone UI_WebApp config).
    add_header X-Content-Type-Options "nosniff" always;
}
