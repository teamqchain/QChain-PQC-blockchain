# =============================================================================
# NGINX DEFAULT CONFIGURATION (Template in docker/ folder)
# =============================================================================
#
# NOTE: This is a backup/template. The actual config used by UI_WebApp
# is in UI_WebApp/nginx.conf (which is copied into the container).
#
# See UI_WebApp/nginx.conf for detailed comments explaining each setting.
#
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Cache fonts and images for 1 year
    location ~* \.(woff|woff2|ttf|otf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache JS/CSS for 7 days
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA routing - serve index.html for all routes (Flutter handles routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
