# =============================================================================
# QCHAIN DOCKER COMPOSE - DEVELOPMENT OVERRIDES
# =============================================================================
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  WHAT IS THIS FILE?                                                     │
# ├─────────────────────────────────────────────────────────────────────────┤
# │  This file EXTENDS docker-compose.yml with development-specific stuff.  │
# │  It enables features like "hot reload" (see changes without rebuild).   │
# │                                                                         │
# │  The main docker-compose.yml builds PRODUCTION images (optimized).      │
# │  This file adds DEVELOPMENT conveniences (live updates, debugging).     │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  HOW TO USE                                                             │
# ├─────────────────────────────────────────────────────────────────────────┤
# │  You must combine BOTH files with the -f flag:                          │
# │                                                                         │
# │  # Start web app with hot reload:                                       │
# │  docker compose -f docker-compose.yml -f docker-compose.dev.yml \       │
# │    --profile web-dev up                                                 │
# │                                                                         │
# │  # Start go-native with live code changes:                              │
# │  docker compose -f docker-compose.yml -f docker-compose.dev.yml \       │
# │    --profile native-dev up                                              │
# │                                                                         │
# │  (The backslash \ means "continue on next line")                        │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  PRODUCTION vs DEVELOPMENT                                              │
# ├─────────────────────────────────────────────────────────────────────────┤
# │  PRODUCTION (docker-compose.yml only):                                  │
# │  → Code is COMPILED into the container                                  │
# │  → Change code = must rebuild container                                 │
# │  → Smaller, faster, optimized                                           │
# │                                                                         │
# │  DEVELOPMENT (with this file):                                          │
# │  → Code folder is MOUNTED into container                                │
# │  → Change code = instantly reflected (hot reload)                       │
# │  → Larger, slower, but much easier to develop                           │
# └─────────────────────────────────────────────────────────────────────────┘
#
# =============================================================================

version: "3.9"

services:

  # ===========================================================================
  # WEBAPP-DEV - Flutter Web with Hot Reload
  # ===========================================================================
  #
  # WHAT IS HOT RELOAD?
  # → You edit code on your computer
  # → Changes appear in browser INSTANTLY (no rebuild needed!)
  # → Huge time saver during development
  #
  # AFTER STARTING:
  # → Open browser: http://localhost:8081
  # → Edit files in UI_WebApp/lib/
  # → See changes instantly!
  #
  webapp-dev:
    # Use pre-built Flutter image (faster than building our own)
    image: ghcr.io/cirruslabs/flutter:3.27.0

    container_name: qchain-webapp-dev

    # Development server runs on port 8081
    ports:
      - "${WEBAPP_DEV_PORT:-8081}:8081"

    # Mount your code INTO the container
    # Your edits appear immediately inside the container
    volumes:
      - ../UI_WebApp:/app                   # Your source code
      - webapp_pub_cache:/root/.pub-cache   # Cache packages

    working_dir: /app

    # Command to run: get dependencies, then start dev server
    # "sh -c" runs multiple commands in sequence
    command: >
      sh -c "flutter pub get &&
             flutter run -d web-server --web-port=8081 --web-hostname=0.0.0.0"

    networks:
      - qchain-network

    profiles:
      - web-dev

    # Allow interactive terminal
    stdin_open: true
    tty: true

  # ===========================================================================
  # GO-NATIVE-DEV - Go with Live Code Changes
  # ===========================================================================
  #
  # Instead of building a binary, this runs "go run main.go" directly.
  # Your code is mounted, so changes work after you re-run the container.
  #
  # NOTE: Go doesn't have true "hot reload" like Flutter.
  # You need to stop and restart to see changes.
  # But at least you don't need to rebuild the entire container!
  #
  go-native-dev:
    # Use pre-built Go image
    image: golang:1.23-alpine

    container_name: qchain-go-native-dev

    depends_on:
      ipfs:
        condition: service_healthy

    environment:
      - IPFS_API_HOST=ipfs
      - IPFS_API_PORT=5001

    # Mount your code directly
    volumes:
      - ../offchain/go-native:/app

    working_dir: /app

    # Run directly with "go run" instead of pre-compiled binary
    command: ["go", "run", "main.go"]

    networks:
      - qchain-network

    profiles:
      - native-dev

# Additional volumes for development caches
volumes:
  webapp_pub_cache:
    driver: local
