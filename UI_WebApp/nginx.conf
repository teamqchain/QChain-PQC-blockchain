# =============================================================================
# NGINX CONFIGURATION FOR FLUTTER WEB APP
# =============================================================================
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  WHAT IS NGINX?                                                         │
# ├─────────────────────────────────────────────────────────────────────────┤
# │  Nginx (pronounced "engine-x") is a web server - software that serves   │
# │  files to browsers over HTTP. It's fast, efficient, and widely used.    │
# │                                                                         │
# │  Our Flutter app compiles to HTML/CSS/JS files. Nginx serves these      │
# │  files when users visit http://localhost:3000                           │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  WHY DO WE NEED CUSTOM CONFIG?                                          │
# ├─────────────────────────────────────────────────────────────────────────┤
# │  Flutter is a Single Page Application (SPA). This means:                │
# │  → There's only ONE HTML file (index.html)                              │
# │  → Navigation happens in JavaScript, not by loading new HTML pages      │
# │  → URLs like /dashboard or /settings don't have actual files            │
# │                                                                         │
# │  Problem: If user goes directly to localhost:3000/dashboard,            │
# │  Nginx looks for a file called "dashboard" - which doesn't exist!       │
# │                                                                         │
# │  Solution: The "try_files" directive below tells Nginx:                 │
# │  "If you can't find the file, serve index.html instead"                 │
# │  Flutter's JavaScript router then handles the /dashboard URL.           │
# └─────────────────────────────────────────────────────────────────────────┘
#
# =============================================================================

server {
    # Listen on port 80 (standard HTTP port)
    # Docker maps this to port 3000 on your computer
    listen 80;

    # Server name (localhost for local development)
    server_name localhost;

    # Where the website files are located inside the container
    # The Flutter build output is copied here by the Dockerfile
    root /usr/share/nginx/html;

    # Default file to serve (when visiting just /)
    index index.html;

    # =========================================================================
    # GZIP COMPRESSION
    # =========================================================================
    # Compress files before sending to browser = faster loading
    # Browser automatically decompresses them
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # =========================================================================
    # CACHING FOR STATIC FILES
    # =========================================================================
    # Tell browsers to cache files locally = faster repeat visits
    # Users don't re-download files they already have

    # Fonts and images: Cache for 1 year (they rarely change)
    location ~* \.(woff|woff2|ttf|otf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JavaScript and CSS: Cache for 7 days (may change between deploys)
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # =========================================================================
    # SPA (SINGLE PAGE APPLICATION) ROUTING
    # =========================================================================
    # This is the MOST IMPORTANT part for Flutter!
    #
    # How try_files works:
    # 1. First, try to serve the exact file requested ($uri)
    # 2. If not found, try it as a directory ($uri/)
    # 3. If still not found, serve index.html (let Flutter handle routing)
    #
    # Example: User visits /dashboard
    # → Nginx looks for /dashboard file (doesn't exist)
    # → Nginx looks for /dashboard/ directory (doesn't exist)
    # → Nginx serves index.html
    # → Flutter's router sees URL is /dashboard and shows Dashboard screen
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # SECURITY HEADERS
    # =========================================================================
    # Basic security protections for the web app

    # Prevent the app from being embedded in iframes on other sites
    # Protects against "clickjacking" attacks
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent browsers from guessing file types
    # Protects against certain attack vectors
    add_header X-Content-Type-Options "nosniff" always;
}
